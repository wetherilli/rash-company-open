<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>라슈 컴퍼니 — 저장 진단</title>
<style>
  body { background:#14161a; color:#d7dae0; font:15px/1.7 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
         margin:0; padding:24px 18px 60px; }
  .wrap { max-width:680px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 4px; letter-spacing:.02em; }
  .sub { color:#8b929c; font-size:13px; margin:0 0 22px; }
  .verdict { border-radius:10px; padding:16px 18px; margin:0 0 22px; font-size:15px; }
  .ok   { background:#17301f; border:1px solid #2f6b45; }
  .bad  { background:#331b19; border:1px solid #7d3a33; }
  .warn { background:#332b17; border:1px solid #7d6a2f; }
  .verdict b { display:block; font-size:17px; margin-bottom:6px; }
  table { border-collapse:collapse; width:100%; margin:0 0 18px; font-size:14px; }
  td { border-top:1px solid #262a31; padding:8px 4px; vertical-align:top; }
  td:first-child { color:#8b929c; width:42%; }
  .y { color:#6fce93; } .n { color:#e08b7f; }
  h2 { font-size:15px; margin:24px 0 8px; color:#b9c0ca; }
  textarea { width:100%; height:190px; background:#0e1013; color:#9aa2ad; border:1px solid #262a31;
             border-radius:8px; padding:10px; font:12px/1.5 ui-monospace,Menlo,monospace; }
  button { background:#2a5c8a; color:#fff; border:0; border-radius:7px; padding:9px 16px;
           font-size:14px; cursor:pointer; margin-top:8px; }
  .hint { color:#8b929c; font-size:13px; }
</style>
<div class="wrap">
<h1>라슈 컴퍼니 — 저장 진단</h1>
<p class="sub">이 쪽이 브라우저에 무엇을 남길 수 있는지 알아봅니다. 게임은 실행되지 않습니다.</p>
<div id="verdict"></div>
<h2>자세한 것</h2>
<table id="rows"></table>
<h2>그대로 옮겨 보내 주십시오</h2>
<textarea id="dump" readonly></textarea>
<button id="copy">복사하기</button>
<p class="hint">이 글상자를 통째로 복사해 만든 사람에게 보내 주시면 됩니다.</p>
</div>
<script>
(function () {
  var R = [], L = [];
  function row(k, v, good) { R.push([k, v, good]); L.push(k + " : " + v); }

  /* 1. 저장소를 쓸 수 있는가 — 게임의 Store 와 같은 방식으로 재 봅니다 */
  var canWrite = false, writeErr = "";
  try { localStorage.setItem("__diag", "1"); localStorage.removeItem("__diag"); canWrite = true; }
  catch (e) { writeErr = (e && e.name ? e.name : "") + " " + (e && e.message ? e.message : e); }
  row("저장소에 쓸 수 있는가", canWrite ? "예" : "아니오 — " + writeErr, canWrite);

  /* 2. 지난번에 들른 흔적이 남아 있는가 — 이것이 핵심입니다 */
  var MARK = "rash_diag_mark", prev = null;
  try { prev = localStorage.getItem(MARK); } catch (e) {}
  var first = !prev;
  if (canWrite) { try { localStorage.setItem(MARK, String(Date.now())); } catch (e) {} }
  row("지난번 들른 흔적", prev ? new Date(+prev).toLocaleString() + " 에 남긴 것이 살아 있음"
                              : "없음 (이 쪽을 처음 열었거나, 지난번 것이 지워짐)", !!prev);

  /* 3. 게임이 실제로 남겨 둔 열쇠들 */
  var keys = [];
  try { for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i); if (k && k.indexOf("rash_company") === 0) keys.push(k); } } catch (e) {}
  var hasUnlock = keys.indexOf("rash_company_unlocked_v1") >= 0;
  var hasVault  = keys.indexOf("rash_company_vault_v1") >= 0;
  row("게임이 남긴 열쇠", keys.length ? keys.length + "개 — " + keys.join(", ") : "하나도 없음", keys.length > 0);
  row("출입 코드 통과 기록", hasUnlock ? "남아 있음" : "없음 — 그래서 코드를 다시 묻습니다", hasUnlock);
  row("보관함", hasVault ? "남아 있음" : "없음", hasVault);

  /* 4. 브라우저가 이 쪽에 얼마를 내주는가 */
  row("쿠키 허용(navigator)", navigator.cookieEnabled ? "예" : "아니오", navigator.cookieEnabled);
  row("주소", (location.origin + location.pathname).slice(0, 120), true);
  row("브라우저", (navigator.userAgent || "").slice(0, 160), true);

  var done = 0, need = 1;
  function finish() {
    if (++done < need) return;
    var t = document.getElementById("rows");
    R.forEach(function (r) {
      var tr = t.insertRow();
      tr.insertCell().textContent = r[0];
      var c = tr.insertCell(); c.textContent = r[1];
      c.className = r[2] === true ? "y" : (r[2] === false ? "n" : "");
    });
    /* ── 판정 ── */
    var v = document.getElementById("verdict"), cls, msg;
    if (!canWrite) {
      cls = "bad";
      msg = "<b>저장이 아예 막혀 있습니다.</b>" +
            "사파리가 이 쪽에 아무것도 남기지 못하게 하고 있습니다. 창을 닫으면 진행이 모두 사라집니다.<br><br>" +
            "· <b>개인정보 보호 창</b>으로 열고 계시다면, 일반 창으로 여십시오.<br>" +
            "· 사파리 설정 → 개인정보 보호 → <b>「모든 쿠키 차단」이 켜져 있으면 꺼</b> 주십시오.";
    } else if (!prev && !keys.length) {
      cls = "warn";
      msg = "<b>지금은 쓸 수 있습니다. 다만 남는지는 아직 모릅니다.</b>" +
            "방금 표시를 하나 남겼습니다. <b>사파리를 완전히 껐다가</b> 이 쪽을 다시 열어 주십시오.<br><br>" +
            "· 다시 열었을 때 「지난번 들른 흔적」이 <b>살아 있으면</b> 저장은 정상입니다.<br>" +
            "· 그래도 <b>없다</b>고 나오면, 개인정보 보호 창이거나 사파리가 끌 때 데이터를 지우는 설정입니다.";
    } else if (prev || keys.length) {
      cls = "ok";
      msg = "<b>저장이 남고 있습니다.</b>" +
            "이 브라우저는 이 쪽의 기록을 제대로 붙들고 있습니다. " +
            "그래도 진행이 사라진다면 저장소 문제가 아니니, 아래 내용을 그대로 보내 주십시오.";
    }
    v.className = "verdict " + cls; v.innerHTML = msg;
    document.getElementById("dump").value =
      "─ 라슈 컴퍼니 저장 진단 ─\n" + new Date().toString() + "\n\n" + L.join("\n");
  }

  /* 5. 저장 공간 — 개인정보 보호 창은 대개 아주 작게 잡힙니다 */
  if (navigator.storage && navigator.storage.estimate) {
    navigator.storage.estimate().then(function (s) {
      var q = s && s.quota ? s.quota : 0;
      row("브라우저가 내준 저장 공간",
          q ? (q / 1048576).toFixed(1) + " MB" + (q < 20 * 1048576 ? "  ← 유난히 작습니다 (개인정보 보호 창일 수 있습니다)" : "")
            : "알 수 없음", q ? (q >= 20 * 1048576) : null);
      if (navigator.storage.persisted)
        return navigator.storage.persisted().then(function (p) {
          row("영구 보관 허가", p ? "받음 (브라우저가 함부로 지우지 않습니다)"
                                 : "없음 (브라우저가 필요하면 지울 수 있습니다)", p);
        });
    }).catch(function () {}).then(finish, finish);
  } else { row("브라우저가 내준 저장 공간", "이 브라우저는 알려 주지 않습니다", null); finish(); }

  document.getElementById("copy").onclick = function () {
    var d = document.getElementById("dump"); d.select();
    try { document.execCommand("copy"); this.textContent = "복사했습니다"; } catch (e) {}
  };
})();
</script>
