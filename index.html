<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>라슈 컴퍼니</title>
<style>
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;background:#0a0a0c;color:#d6d3ce;
    font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:15px;line-height:1.75;
  }
  #app{max-width:960px;margin:0 auto;padding:14px 14px 40px;}

  /* ── 머리 ─────────────────────────────── */
  header{
    display:flex;align-items:baseline;gap:14px;
    border-bottom:1px solid #3a2226;padding-bottom:8px;margin-bottom:12px;
  }
  header .brand{color:#c8403a;font-weight:800;letter-spacing:.22em;font-size:17px;}
  header .chap{color:#7d7a76;font-size:12.5px;letter-spacing:.08em;}
  header .right{margin-left:auto;color:#8b8681;font-size:12.5px;}
  header .right b{color:#d8b26a;font-weight:600;}

  /* ── 무대(이미지) ───────────────────────
   *  그림칸의 세로 폭은 --stageh 로 고정됩니다.
   *  가로로 긴 배경이든 세로로 긴 초상이든 칸 크기는 그대로고,
   *  그림만 안에서 잘리지 않게 맞춰집니다 (object-fit:contain).
   *  높이를 바꾸고 싶으면 아래 --stageh 한 줄만 고치세요.
   */
  :root{ --stageh:300px; }
  #stage{display:none;border:1px solid #2a2a30;background:#0b0b0f;margin-bottom:10px;overflow:hidden;}
  #stage.on{display:block;}
  /* 적이 나타났을 때만 뜨는 체력바 — 이름은 왼쪽 아래, 공·방은 오른쪽 아래 */
  #foehp{display:none;margin-bottom:8px;}
  #foehp.on{display:block;}
  #foehp .row{display:flex;justify-content:space-between;align-items:baseline;margin-top:3px;}
  #foehp .nm{color:#c9c5c0;font-weight:700;font-size:12.5px;}
  #foehp .stat{color:#8b8681;font-size:11.5px;}
  body.battling #foehp .nm{color:#dcd0ce;}
  /* 거울굴절철도 2호선 — 지금이 몇 순환의 몇 번째인가. 다른 갈래에서는 뜨지 않습니다. */
  #foehp .railtag{
    display:inline-block;margin-left:6px;padding:1px 6px;border-radius:3px;
    border:1px solid #6b5a34;background:#241f14;color:#d8b26a;
    font-style:normal;font-weight:700;font-size:10.5px;letter-spacing:.02em;
    vertical-align:1px;white-space:nowrap;
  }
  /* 배경 한 겹, 그 위에 사람 한 겹 */
  .scenebox{position:relative;height:var(--stageh);overflow:hidden;background:#08080b;}
  .scenebox img.scene{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9;
  }
  .scenebox img.scene.fit{object-fit:contain;opacity:1;}
  /* 흰 종이에 그린 그림은 칸 바탕도 흰색으로 — 검은 여백이 생기지 않게 */
  .scenebox.paper{background:#f2efe9;}
  /* 암전 — 보스가 나오기 전, 배경이 잠깐 꺼지며 깜빡인다 (startBossCine 참고) */
  .scenebox.blackout{background:#000;animation:blackoutFlicker 1s steps(1,end);}
  @keyframes blackoutFlicker{
    0%,55%  {background:#000;}
    62%     {background:#141416;}
    68%,80% {background:#000;}
    86%     {background:#0e0e11;}
    100%    {background:#000;}
  }
  .scenebox.paper .placename{
    color:#5a5148;background:linear-gradient(to top, rgba(242,239,233,.95), rgba(242,239,233,0));
  }
  .scenebox .figwrap{
    position:absolute;inset:0;display:flex;align-items:flex-end;padding:0 3%;
  }
  .scenebox .figwrap.left{justify-content:flex-start;}   /* 대사하는 사람 */
  .scenebox .figwrap.mid {justify-content:center;}       /* 적 */
  .scenebox .figwrap img{
    height:96%;width:auto;max-width:52%;object-fit:contain;
    filter:drop-shadow(0 5px 12px rgba(0,0,0,.6));
    /* --imgscale — 원본 그림 안에서 몸집이 작게 잡힌 적만 키웁니다 (drawStage 참고).
     * 안 적으면 1(그대로). 바닥 가운데를 축으로 삼아 자리는 안 밀립니다.
     * 맞을 때·쓰러질 때 애니메이션도 이 축을 그대로 물려받아야 하므로,
     * transform 이 아니라 커스텀 속성으로 두고 아래 keyframes 에서 함께 곱합니다. */
    transform:scale(var(--imgscale,1));transform-origin:50% 100%;
  }
  .scenebox .figwrap.mid img{max-width:74%;}
  /* 키워 세우는 적(--imgscale 이 붙은 것) — 바닥이 아니라 칸 한가운데에 답니다.
   * 바닥을 축으로 키우면 위로만 자라 머리가 잘려 나갑니다. 축도 가운데로 옮겨,
   * 커진 만큼 위아래로 고르게 벌어지게 합니다. 맞을 때·쓰러질 때 애니메이션도
   * 이 축을 그대로 물려받습니다 (keyframes 는 scale 만 곱하고 축은 안 건드립니다). */
  .scenebox .figwrap.scaled{align-items:center;}
  .scenebox .figwrap.scaled img{transform-origin:50% 50%;}
  /* 맞을 때 — 참격이 한 번 그어진다 */
  .scenebox .slashfx{
    position:absolute;left:50%;top:50%;
    height:108%;width:auto;pointer-events:none;z-index:3;
    filter:drop-shadow(0 0 10px rgba(255,240,220,.75));
    animation:slashfx 420ms ease-out forwards;
  }
  @keyframes slashfx{
    0%  {opacity:0;  transform:translate(-50%,-50%) scale(.62) rotate(-14deg);}
    18% {opacity:1;  transform:translate(-50%,-50%) scale(1.02) rotate(-4deg);}
    55% {opacity:.95;transform:translate(-50%,-50%) scale(1.10) rotate(-1deg);}
    100%{opacity:0;  transform:translate(-50%,-50%) scale(1.22) rotate(2deg);}
  }
  /* 맞을 때 — 적이 좌우로 흔들리며 점멸한다 */
  .scenebox .figwrap img.hit{animation:foehit 420ms steps(1,end);}
  /* 어느 단계든 scale(var(--imgscale,1)) 을 먼저 곱해 둡니다 —
   * 안 그러면 애니메이션이 도는 동안만 확대가 풀렸다 돌아옵니다. */
  @keyframes foehit{
    0%  {transform:scale(var(--imgscale,1)) translateX(0);   opacity:1;}
    10% {transform:scale(var(--imgscale,1)) translateX(-9px);opacity:.3;}
    22% {transform:scale(var(--imgscale,1)) translateX(8px); opacity:1;}
    34% {transform:scale(var(--imgscale,1)) translateX(-7px);opacity:.35;}
    46% {transform:scale(var(--imgscale,1)) translateX(6px); opacity:1;}
    58% {transform:scale(var(--imgscale,1)) translateX(-4px);opacity:.5;}
    70% {transform:scale(var(--imgscale,1)) translateX(3px); opacity:1;}
    84% {transform:scale(var(--imgscale,1)) translateX(-2px);opacity:.8;}
    100%{transform:scale(var(--imgscale,1)) translateX(0);   opacity:1;}
  }
  /* 쓰러질 때 — 깜빡이다 살짝 내려앉으며 사라진다 */
  .scenebox .figwrap img.gone{animation:foefall 1.1s steps(1,end) forwards;}
  @keyframes foefall{
    0%{opacity:1;transform:scale(var(--imgscale,1)) translateY(0);}
    8%{opacity:.1;}  16%{opacity:1;}
    24%{opacity:.1;} 32%{opacity:1;}
    40%{opacity:.1;} 48%{opacity:1;}
    56%{opacity:.6;transform:scale(var(--imgscale,1)) translateY(6px);}
    72%{opacity:.35;transform:scale(var(--imgscale,1)) translateY(16px);}
    100%{opacity:0;transform:scale(var(--imgscale,1)) translateY(30px);}
  }
  /* 지명은 칸 안쪽 아래에 얹습니다 — 칸 높이는 늘 --stageh 그대로 */
  .scenebox .placename{
    position:absolute;left:0;right:0;bottom:0;
    color:#d8b26a;letter-spacing:.16em;font-size:12.5px;padding:7px 12px;
    background:linear-gradient(to top, rgba(6,6,9,.92), rgba(6,6,9,0));
  }
  /* 전투 중 대사를 적이 선 자리(가운데)에 큰 글씨로 얹습니다 — battleSay 전용
   * (showBattleCaption 참고). 다음 무대 그림이 그려지면 함께 지워집니다. */
  .scenebox .battlecap{
    position:absolute;left:6%;right:6%;top:10%;
    text-align:center;font-size:21px;font-weight:800;line-height:1.4;
    color:#fff;text-shadow:0 2px 5px rgba(0,0,0,.85), 0 0 16px rgba(0,0,0,.6);
    pointer-events:none;z-index:4;
    animation:battlecapIn .28s ease-out;
  }
  @keyframes battlecapIn{
    from{opacity:0;transform:translateY(-8px);}
    to  {opacity:1;transform:translateY(0);}
  }
  /* 초상은 흰 바탕이라 살짝 눌러 준다 */
  .card{background:#efeae1;border:1px solid #cabfae;padding:8px;flex:0 0 auto;}
  .card img{display:block;max-width:190px;max-height:250px;width:auto;height:auto;}
  .card .tag{
    color:#5a5148;font-size:11px;letter-spacing:.12em;text-align:center;
    padding-top:6px;border-top:1px solid #cabfae;margin-top:6px;
  }

  /* ── 로그 ─────────────────────────────── */
  #log{
    border:1px solid #2a2a30;background:#0e0e12;height:330px;overflow-y:auto;
    padding:16px 18px;
  }
  #log p{margin:0 0 9px;}
  #log .n     {color:#c2bfba;}
  #log .who   {color:#c8403a;font-weight:700;font-size:13px;letter-spacing:.06em;margin-bottom:1px;}
  #log .d     {color:#e8e4de;padding-left:2px;}
  #log .sys   {color:#6e6a66;font-size:13px;}
  #log .good  {color:#7fa86a;}
  #log .bad   {color:#c8403a;}
  #log .hit   {color:#ddd8d2;font-size:14px;}
  #log .gain  {color:#d8b26a;}
  #log .place {color:#d8b26a;letter-spacing:.18em;font-size:13px;margin:14px 0 8px;}
  #log .todo  {color:#55524e;font-style:italic;font-size:13px;border-left:2px solid #333;padding-left:10px;}
  #log .recall{color:#8a7fa8;}
  #log.recalling{background:#0d0b12;}
  #log .divider{border-top:1px solid #26262c;margin:12px 0;}
  /* 거울굴절철도 결과 카드 — 자랑할 만한 한 덩이라 눈에 띄게 테두리를 두릅니다 */
  #log pre.resultcard, pre.resultcard{
    font-family:inherit;color:#d8b26a;background:#17140d;border:1px solid #4a3f28;
    padding:10px 12px;margin:0 0 9px;white-space:pre-wrap;font-size:13px;line-height:1.6;
  }

  /* ── 파티 ─────────────────────────────── */
  /* 셋이 기본. 조력자가 붙어 넷이 되면 넷이 나란히 섭니다 */
  #party{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;}
  #party.four{grid-template-columns:repeat(4,1fr);}
  /* 왼쪽 띠는 «누구인가» 를 말합니다 — 작성위원은 파랑, 지원은 연두.
     테두리 색은 «지금 무엇을 하는가» 를 말합니다. 둘은 겹치지 않습니다. */
  .pcard{
    position:relative;border:1px solid #2a2a30;border-left:4px solid #4a6d92;
    background:#101014;padding:9px 10px;font-size:13px;
  }
  .pcard.down{opacity:.4;}
  /* 지금 명령을 고르는 사람 — 초록 */
  .pcard.acting{border-color:#5ec26a;box-shadow:inset 0 0 0 1px #1e4023;}
  /* 공격을 고른 사람 — 분홍 */
  .pcard.cmd-attack{border-color:#e07aa8;box-shadow:inset 0 0 0 1px #4a2233;}
  /* 방어를 고른 사람 — 파랑 */
  .pcard.cmd-guard {border-color:#5aa8e0;box-shadow:inset 0 0 0 1px #1c3547;}
  /* 적이 노리는 사람 — 붉은 점선. 테두리와 겹쳐도 보이도록 바깥에 두른다 */
  .pcard.aimed{background:#170e10;}
  .pcard.aimed::after{
    content:"";position:absolute;inset:-3px;border:2px dashed #c8403a;pointer-events:none;
  }
  /* 지원 작성위원 — 연두 */
  .pcard.sup{background:#101a10;border-left-color:#9ccc65;}
  .pcard .suptag {color:#9ccc65;font-size:11px;letter-spacing:.06em;}
  /* 조력자 — 이야기에서만 옆에 서 주는 사람. 분홍 */
  .pcard.ally{background:#1c1016;border-left-color:#e07aa8;}
  .pcard .allytag{color:#e07aa8;font-size:11px;letter-spacing:.06em;}
  /* 조력자는 이름도 제 색으로 강조합니다 — data/allies.js 의 color */
  .pcard .nm .allyname{font-weight:700;}
  /* 고유 능력 패시브 스택 — 광신 n, 격노 n 같은 것. 다른 태그와 안 겹치는 보라 */
  .pcard .stacktag{color:#b48ce0;font-size:11px;letter-spacing:.06em;}
  .pcard .aimtag  {color:#c8403a;font-size:11px;letter-spacing:.06em;}
  .pcard .turntag {color:#5ec26a;font-size:11px;letter-spacing:.1em;}
  .pcard .readytag{color:#b9b4ae;font-size:11px;letter-spacing:.06em;}
  .pcard.cmd-attack .readytag{color:#e07aa8;}
  .pcard.cmd-guard  .readytag{color:#5aa8e0;}
  /* 관리자 능력이 이번 턴에 걸려 있다는 자국 — 교정은 막는 쪽이라 파랑,
     독촉은 때리는 쪽이라 주황. 턴이 넘어가면 저절로 사라집니다. */
  .pcard .corrtag {color:#5aa8e0;font-size:11px;letter-spacing:.06em;}
  .pcard .pushtag {color:#e0a05a;font-size:11px;letter-spacing:.06em;}
  /* 번개 — 화면 전체를 한 번 하얗게 덮었다 걷습니다 */
  .flashfx{
    position:fixed;inset:0;z-index:9999;pointer-events:none;
    background:#fff;animation:flashfx 460ms ease-out forwards;
  }
  @keyframes flashfx{
    0%  {opacity:0;}
    8%  {opacity:.85;}
    22% {opacity:.15;}
    34% {opacity:.6;}
    100%{opacity:0;}
  }
  /* 적에게 맞을 때 화면이 흔들립니다. 강타면 크게. */
  #app.shake{animation:shake 320ms ease-in-out;}
  #app.shakehard{animation:shakehard 620ms ease-in-out;}
  @keyframes shake{
    0%,100%{transform:translate(0,0);}
    15%{transform:translate(-4px,2px);}   35%{transform:translate(4px,-2px);}
    55%{transform:translate(-3px,1px);}   75%{transform:translate(2px,-1px);}
  }
  @keyframes shakehard{
    0%,100%{transform:translate(0,0) rotate(0);}
    8%{transform:translate(-11px,5px) rotate(-.5deg);}
    20%{transform:translate(10px,-6px) rotate(.5deg);}
    32%{transform:translate(-9px,4px) rotate(-.4deg);}
    46%{transform:translate(8px,-4px) rotate(.35deg);}
    60%{transform:translate(-6px,3px) rotate(-.25deg);}
    74%{transform:translate(4px,-2px) rotate(.15deg);}
    88%{transform:translate(-2px,1px) rotate(0);}
  }
  .slot .synon{color:#d8b26a;font-size:11px;letter-spacing:.06em;font-weight:400;}

  /* ── 인격 장착 — 접었다 폈다 ──────────── */
  .eqbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 4px;}
  .eqchk{display:inline-flex;align-items:center;gap:6px;color:#c9c5c0;font-size:13px;cursor:pointer;}
  .eqchk input{accent-color:#c8403a;width:15px;height:15px;cursor:pointer;}
  .eqhead{
    display:flex;align-items:baseline;gap:9px;cursor:pointer;
    border:1px solid #2a2a30;background:#131318;padding:8px 11px;margin-top:8px;
  }
  .eqhead:hover{border-color:#c8403a;}
  .eqhead.open{border-color:#4a3a20;background:#17150f;}
  /* 강제 편성 중일 때, 지금 편성에 든 사람만 금테로 눈에 띄게 합니다 */
  .eqhead.inparty{border-color:#d8b26a;background:#1a160d;}
  .eqhead .arrow{color:#d8b26a;font-size:12px;width:12px;}
  .eqhead b{color:#e8e4de;}
  .eqhead .partytag{
    color:#0e0c09;background:#d8b26a;font-size:10.5px;font-weight:700;
    letter-spacing:.03em;padding:1px 7px;border-radius:3px;
  }
  .eqhead .wearing{color:#8b8681;font-size:12px;}
  .eqhead .cnt{margin-left:auto;color:#6e6a66;font-size:11.5px;}
  .eqbody{margin-top:6px;}

  /* ── 동기화 — 작성위원마다 한 줄 ─────────── */
  .syncrow{
    display:flex;align-items:center;gap:12px;
    border:1px solid #2a2a30;background:#131318;padding:9px 11px;margin-top:8px;
  }
  .syncrow button{flex:none;white-space:nowrap;order:2;}
  .syncrow .body{flex:1;min-width:0;order:1;}
  .syncrow .nm{color:#e8e4de;font-weight:700;}
  .syncrow .sub{color:#8b8681;font-size:11.5px;margin-top:2px;}

  .pcard .nm{color:#e8e4de;font-weight:700;}
  .pcard .id{color:#8b8681;font-size:11.5px;margin:1px 0 5px;}
  .pcard .st{color:#7d7a76;font-size:11.5px;}
  .pcard .cmd{color:#d8b26a;font-size:11.5px;}
  .pcard.cmd-attack .cmd{color:#e07aa8;}
  .pcard.cmd-guard  .cmd{color:#5aa8e0;}
  .hpbar{height:7px;background:#241a1c;border:1px solid #3a2226;margin:3px 0;}
  .hpbar i{display:block;height:100%;background:#8d3b36;}
  .star{color:#d8b26a;letter-spacing:-1px;}

  /* ── 시너지 ───────────────────────────── */
  #synergy{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  #synergy .none{color:#4e4b47;font-size:11.5px;letter-spacing:.05em;}
  .syn{
    border:1px solid #4a3a20;background:#171208;color:#d8b26a;
    font-size:11.5px;padding:3px 9px;display:inline-flex;gap:7px;align-items:center;
  }
  .syn b{font-weight:700;}
  .syn .cnt{color:#8a7440;}
  .syn .eff{color:#b9945a;}
  .adv{
    border:1px solid #3a3550;background:#14121c;color:#a99ad0;
    font-size:11.5px;padding:3px 9px;display:inline-flex;gap:6px;align-items:center;
  }
  .gift{
    border:1px solid #24503f;background:#0d1712;color:#7fc0a0;
    font-size:11.5px;padding:3px 9px;display:inline-flex;gap:6px;align-items:center;
  }
  #log .crit{color:#f0c46a;font-weight:700;}
  #log .heavy{color:#f05a50;font-weight:700;font-size:14.5px;}
  body.battling #log .heavy{color:#ff6a5e;}
  .syn.full{border-color:#7a5c22;background:#1e1608;box-shadow:0 0 0 1px #3a2a10 inset;}

  /* ── 버튼 ─────────────────────────────── */
  /* ── 엔케팔린 눈금 ────────────────────── */
  #enk{margin-top:10px;}
  #enk:empty{margin-top:0;}
  .enkwrap{
    display:flex;align-items:center;gap:9px;flex-wrap:wrap;
    border:1px solid #2a2a30;background:#101014;padding:7px 11px;font-size:12px;
  }
  .enkwrap .enknm{color:#6f8fa8;letter-spacing:.14em;font-weight:700;}
  .enkwrap .enkpips{display:flex;gap:3px;}
  .enkwrap .enkpips i{
    display:block;width:13px;height:9px;background:#181a20;border:1px solid #2f3742;
  }
  .enkwrap .enkpips i.on{background:#4f7f9c;border-color:#6f9fbb;}
  .enkwrap .enknum{color:#cfe0ea;font-weight:700;}
  .enkwrap .enksub{color:#6e6a66;margin-left:auto;}

  /* ── 관리력 눈금 ──────────────────────── */
  #manage{margin-top:10px;}
  #manage:empty{margin-top:0;}
  .mgwrap{
    display:flex;align-items:center;gap:9px;flex-wrap:wrap;
    border:1px solid #5a3a1c;background:#171008;padding:7px 11px;font-size:12px;
  }
  .mgwrap .mgnm{color:#d8b26a;letter-spacing:.16em;font-weight:700;}
  .mgwrap .mgpips{display:flex;gap:4px;}
  .mgwrap .mgpips i{
    display:block;width:17px;height:11px;background:#1d1810;border:1px solid #4a3a20;
  }
  .mgwrap .mgpips i.on{background:#d8b26a;border-color:#f0d094;}
  .mgwrap .mgnum{color:#f0d79c;font-weight:700;}
  .mgwrap .mgsub{color:#8a7440;margin-left:auto;}
  .mgskills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .mgsk{
    border:1px solid #3a2f1a;background:#12100a;color:#a89468;
    font-size:11.5px;padding:2px 9px;display:inline-flex;gap:7px;align-items:baseline;
  }
  .mgsk b{color:#e8c98a;font-weight:700;}
  .mgsk i{color:#8a7440;font-style:normal;font-size:11px;}
  .mgsk.off{opacity:.42;}

  /* 작성위원 고유 능력 설명 — 관리력 칸(탠·금색)과 색으로 갈리게 회색·흰색 */
  .uskill{
    border:1px solid #4a4a54;background:#3a3a42;color:#f2f2f2;
    font-size:11.5px;padding:2px 9px;display:inline-flex;gap:7px;align-items:baseline;
  }
  .uskill b{color:#ffffff;font-weight:700;}
  /* 손잡이(#actions)보다도 아래, 화면 맨 아래 자리 */
  .uskillbox{margin-top:10px;}
  .uskillbox:not(:empty){border-top:1px dashed #2a2a30;padding-top:8px;}

  #actions{margin-top:12px;display:flex;flex-wrap:wrap;gap:7px;}
  button{
    background:#16161b;border:1px solid #34343c;color:#c9c5c0;
    font-family:inherit;font-size:13.5px;padding:7px 15px;cursor:pointer;
  }
  button:hover:not(:disabled){background:#1e1e25;border-color:#c8403a;color:#fff;}
  button:disabled{opacity:.35;cursor:default;}
  button.primary{border-color:#7a2b28;color:#e6b0ac;}
  button.ghost{border-color:#2a2a30;color:#7d7a76;}
  /* 작성위원 고유 능력 손잡이 — 보라색으로 따로 갈린다 */
  button.skill{border-color:#6f4a91;color:#c9a8e6;}
  body.battling button.skill{border-color:#7d55a8;color:#d3b6ef;}
  /* 제1발톱 「지령」— 그 차례에 내려온 지령(공격 또는 방어 중 하나)을
   * 연두색으로 짚어 준다. 지원 작성위원의 연두(#9ccc65)와 같은 색이다. */
  button.claw1{border-color:#9ccc65;color:#c5e1a5;}
  body.battling button.claw1{border-color:#a8d876;color:#d0e8a8;}
  .codein{
    background:#0b0b0f;border:1px solid #34343c;color:#e8e4de;
    font-family:inherit;font-size:14px;padding:7px 12px;min-width:180px;outline:none;
    letter-spacing:.1em;
  }
  .codein:focus{border-color:#c8403a;}
  /* 출입 코드 화면 — 칸과 손잡이를 가운데로 */
  #actions.mid{justify-content:center;}
  #actions.mid .codein{text-align:center;letter-spacing:.24em;}

  /* ── 패치 노트 ──────────────────────────── */
  .patch{border:1px solid #2a2a30;background:#101014;padding:11px 14px;margin:10px 0;}
  .patch.now{border-color:#7a5c22;background:#17150f;}
  .patch .pv{color:#d8b26a;font-weight:700;letter-spacing:.08em;font-size:13.5px;}
  .patch .pv .pd{color:#6e6a66;font-weight:400;font-size:11.5px;margin-left:10px;letter-spacing:0;}
  .patch .pl{margin:7px 0 0;padding-left:18px;color:#c2bfba;font-size:13px;line-height:1.75;}
  .patch .pl li{margin:0 0 3px;}
  /* 접기 — 머리는 누를 수 있는 자리이므로 손 모양을 줍니다 */
  .patch .pv{cursor:pointer;user-select:none;}
  .patch .pv:hover{color:#f0d79c;}
  .patch .pv .pfold{display:inline-block;width:14px;color:#8b8681;font-weight:400;}
  .patch.folded .pl{display:none;}
  .patch.folded{padding:8px 14px;}
  /* 한참 지난 판들 — <details> 로 접어 두고, 기본은 닫힌 채입니다 */
  .patchold{margin-top:8px;}
  .patchold > summary{
    cursor:pointer;color:#8b8681;font-size:12.5px;padding:6px 2px;user-select:none;
  }
  .patchold > summary:hover{color:#c2bfba;}
  /* 창 오른쪽 위에 늘 떠 있는 닫기 — 패치 노트가 길어져도 스크롤 없이 바로 닫습니다.
   * #modal 의 형제라 위치가 뷰포트 기준으로 고정됩니다(#app 의 흔들림과 무관). */
  .modaltopclose{
    position:fixed;top:16px;right:16px;z-index:21;
    width:32px;height:32px;line-height:30px;text-align:center;padding:0;
    background:#16161b;border:1px solid #3a3a42;color:#c9c5c0;
    font-size:18px;font-family:inherit;cursor:pointer;
  }
  .modaltopclose:hover{border-color:#c8403a;color:#f0d79c;}
  /* 지난번 접속 뒤에 새로 나온 덩이 */
  .patch .pv .pnew{
    color:#0a0a0c;background:#d8b26a;font-size:10px;font-weight:700;
    letter-spacing:.08em;padding:1px 5px;margin-left:8px;vertical-align:1px;
  }

  /* ── 특정 배정 광고 문구 ─────────────────
   *  문구 자체는 data/pickup.js 의 line 에서 갈아 끼웁니다. */
  .pkline{
    position:relative;overflow:hidden;
    border:1px solid #7a5c22;background:linear-gradient(90deg,#241a08,#1a1408 60%,#241a08);
    color:#f0d79c;font-size:22px;font-weight:700;letter-spacing:.1em;
    padding:0 14px;margin:2px 0 12px;text-align:center;
    height:124px;display:flex;align-items:center;justify-content:center;
  }
  /* 그림을 깔았을 때 — 고르게 눌러서 글씨가 읽히게 한다 */
  .pkline.pic{
    background-size:cover;background-position:center 42%;
    text-shadow:0 2px 10px #000, 0 0 18px rgba(0,0,0,.9);
  }
  .pkline.pic::before{content:"";position:absolute;inset:0;background:rgba(8,6,4,.5);}
  .pkline span{position:relative;}
  /* 띠 안의 작은 두 번째 줄 — 장 이름 같은 것 */
  .pkline .pksub{
    display:block;font-style:normal;font-size:13px;font-weight:600;
    letter-spacing:.06em;color:#e8dcc0;margin-top:4px;opacity:.9;
  }
  /* 상점 칸 머리의 작은 띠 — 글씨 없이 그림만. 칸 크기를 서로 맞추는 몫입니다. */
  .pkline.small{
    height:56px;margin:0 0 8px;padding:0;letter-spacing:0;
    border-color:#3a3a44;
  }
  .pkline.small::before{background:rgba(8,6,4,.45);}
  /* 띠 안에 이름을 얹을 때 — 큰 띠보다 작게, 자간도 좁게 */
  .pkline.small span{
    font-size:18px;font-weight:700;letter-spacing:.04em;color:#f2ece2;
    text-shadow:0 2px 8px #000, 0 0 14px rgba(0,0,0,.95);
  }
  /* 잠긴 칸 — 그림 없이 빈 띠만. 칸 높이를 맞추는 몫입니다. */
  .pkline.small.blank{
    background:repeating-linear-gradient(135deg,#141419,#141419 6px,#101015 6px,#101015 12px);
    border-color:#26262e;
  }
  .pkline.small.blank::before{background:none;}
  /* 잠긴 칸의 이름은 죽여서 — 아직 못 가는 곳임을 색으로 알립니다 */
  .pkline.small.blank span{color:#6c6c78;text-shadow:none;}
  .slot.pk .pkline.small{border-color:#7a5c22;}
  .slot.pk{border-color:#7a5c22;background:#171208;}

  /* ── 배정에서 ★★★ 이 나왔을 때 ──────────
   *  결과를 펼치기 전에 화면이 한 번 크게 빛납니다. */
  .flashfx{
    position:fixed;inset:0;z-index:40;pointer-events:none;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 50%, rgba(216,178,106,.30), rgba(0,0,0,.88) 62%);
    animation:flashbg 900ms ease-out forwards;
  }
  /* 빛이 터진 뒤 — 누를 때까지 머문다 */
  .flashfx.hold{pointer-events:auto;cursor:pointer;}
  /* 특정 배정의 대상이 나왔을 때 — 금빛 대신 초록빛 */
  .flashfx.green{
    background:radial-gradient(circle at 50% 50%, rgba(106,216,140,.30), rgba(0,0,0,.88) 62%);
  }
  .flashfx.green .ring{border-color:#9cf0b4;box-shadow:0 0 40px 12px rgba(156,240,180,.55);}
  .flashfx.green .beam{background:#bdf6ce;box-shadow:0 0 26px 7px rgba(189,246,206,.75);}
  .flashfx.green .txt{color:#bdf6ce;text-shadow:0 0 24px rgba(189,246,206,.9);}
  .flashfx.green .txt .line{color:#c8ead2;text-shadow:0 0 14px rgba(189,246,206,.6);}
  .flashfx.green .txt .star{color:#bdf6ce;}
  .flashfx.green .tap{color:#8fbd9c;}
  /* 동기화 단계가 오를 때 — 금빛 대신 붉은빛 (전투 화면과 같은 색) */
  .flashfx.red{
    background:radial-gradient(circle at 50% 50%, rgba(224,80,72,.30), rgba(0,0,0,.88) 62%);
  }
  .flashfx.red .ring{border-color:#f0928a;box-shadow:0 0 40px 12px rgba(224,80,72,.55);}
  .flashfx.red .beam{background:#ffb3ac;box-shadow:0 0 26px 7px rgba(255,106,94,.75);}
  .flashfx.red .txt{color:#ffb3ac;text-shadow:0 0 24px rgba(224,80,72,.9);font-size:32px;}
  .flashfx.red .txt .line{color:#f0c4c0;text-shadow:0 0 14px rgba(224,80,72,.6);}
  .flashfx.red .txt .star{color:#ffb3ac;}
  .flashfx.red .tap{color:#cc8480;}
  /* 동기화 1·4·8·12단계 — 고유 능력 해금·강화. 금빛도 붉은빛도 아닌 흰빛으로 */
  .flashfx.white{
    background:radial-gradient(circle at 50% 50%, rgba(255,255,255,.34), rgba(0,0,0,.88) 62%);
  }
  .flashfx.white .ring{border-color:#ffffff;box-shadow:0 0 40px 12px rgba(255,255,255,.6);}
  .flashfx.white .beam{background:#ffffff;box-shadow:0 0 26px 7px rgba(255,255,255,.8);}
  .flashfx.white .txt{color:#ffffff;text-shadow:0 0 24px rgba(255,255,255,.95);}
  .flashfx.white .txt .line{color:#eaeaea;text-shadow:0 0 14px rgba(255,255,255,.6);}
  .flashfx.white .txt .star{color:#ffffff;}
  .flashfx.white .tap{color:#cfcfcf;}
  @keyframes flashbg{
    0%{opacity:0;} 12%{opacity:1;} 100%{opacity:1;}
  }
  .flashfx .ring{
    position:absolute;width:70px;height:70px;border-radius:50%;
    border:2px solid #f0d79c;box-shadow:0 0 40px 12px rgba(240,215,156,.55);
    animation:flashring 900ms cubic-bezier(.15,.7,.3,1) forwards;
  }
  @keyframes flashring{
    0%{transform:scale(.2);opacity:0;}
    16%{opacity:1;}
    100%{transform:scale(11);opacity:0;}
  }
  .flashfx .beam{
    position:absolute;width:210%;height:3px;background:#f6e6bd;
    box-shadow:0 0 26px 7px rgba(246,230,189,.75);
    animation:flashbeam 900ms ease-out forwards;
  }
  @keyframes flashbeam{
    0%{transform:scaleX(0);opacity:0;}
    18%{transform:scaleX(1);opacity:1;}
    52%{opacity:.9;}
    100%{transform:scaleX(1);opacity:0;}
  }
  .flashfx .txt{
    position:relative;color:#f6e6bd;font-size:48px;letter-spacing:.1em;text-align:center;
    text-shadow:0 0 24px rgba(246,230,189,.9);
    animation:flashtxt 900ms ease-out forwards;
  }
  /* 인격에 적힌 짧은 설명 한 줄 */
  .flashfx .txt .line{
    margin-top:14px;font-size:17px;letter-spacing:.04em;color:#e8dcc0;
    font-style:italic;text-shadow:0 0 14px rgba(246,230,189,.6);
    max-width:80vw;line-height:1.7;
  }
  @keyframes flashtxt{
    0%{transform:scale(.4);opacity:0;}
    30%{transform:scale(1.08);opacity:1;}
    100%{transform:scale(1);opacity:1;}
  }
  /* 「눌러서 계속」 — 빛이 잦아든 뒤에 조용히 떠오른다 */
  .flashfx .tap{
    position:absolute;left:0;right:0;bottom:14%;
    text-align:center;color:#bda978;font-size:13px;letter-spacing:.22em;
    opacity:0;
  }
  .flashfx.hold .tap{animation:flashtap 1.6s ease-in-out .1s infinite;}
  @keyframes flashtap{
    0%{opacity:0;} 28%{opacity:.95;} 70%{opacity:.95;} 100%{opacity:0;}
  }

  /* ── 모달 ─────────────────────────────── */
  #modal{
    display:none;position:fixed;inset:0;background:#000000d0;z-index:20;
    overflow-y:auto;padding:26px 14px;
  }
  #modal.on{display:block;}
  .sheet{max-width:900px;margin:0 auto;background:#0e0e12;border:1px solid #34343c;padding:18px 20px;}
  .sheet h2{margin:0 0 4px;color:#c8403a;font-size:16px;letter-spacing:.14em;}
  .sheet .hint{color:#6e6a66;font-size:12.5px;margin-bottom:14px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;}
  /* 글이 긴 칸은 창 너비를 다 씁니다 — 우편함처럼 줄글이 들어가는 곳 */
  .grid.one{grid-template-columns:1fr;}
  /* 칸이 셋뿐인 줄은 «반드시» 셋을 나란히 세웁니다 — 상점에서 한 칸짜리 덩이가
   * 줄마다 하나씩 내려가 스크롤이 길어지던 것을 한 줄로 모으는 몫입니다.
   * 좁은 화면(640px 아래)에서는 아래 미디어 규칙이 다시 한 줄씩으로 되돌립니다. */
  .grid.three{grid-template-columns:repeat(3,1fr);}
  /* 우편 칸의 마지막 줄 — 남은 날과 「눌러서 받기」를 오른쪽에 붙입니다 */
  .slot .mailfoot{text-align:right;margin-top:4px;}
  /* 방금 받은 결과 / 못 받은 까닭 — 창 위에 붙습니다 */
  .mailnote{border-left:3px solid;padding:8px 12px;margin:8px 0 4px;font-size:13px;}
  .mailnote.ok{border-color:#d8b26a;background:#17150f;color:#f0d79c;}
  .mailnote.no{border-color:#c8403a;background:#170e10;color:#e0a09a;}
  .slot{border:1px solid #2a2a30;background:#121218;padding:9px 11px;cursor:pointer;font-size:13px;}
  .slot:hover{border-color:#c8403a;}
  .slot.sel{border-color:#d8b26a;background:#17151a;}
  /* 가로로 통째를 차지하는 칸 — 상점 맨 위 기념 배정에 씁니다 */
  .slot.wide{grid-column:1 / -1;}
  .slot.wide .pkline{margin:-2px 0 8px;height:150px;}
  .slot .nm{color:#e8e4de;font-weight:700;}
  .slot .sub{color:#8b8681;font-size:11.5px;}
  .slot .lock{color:#55524e;font-size:11.5px;}
  /* 캡처만 하고 누르지는 않는 칸 — 결과 카드 화면(.mrcard)이 씁니다 */
  .slot.ro{cursor:default;}
  .slot.ro:hover{border-color:#2a2a30;}

  /* ── 결과 카드 화면 — 거울굴절철도를 완주하면 여는 별도 화면 ──────
   *  캡처해서 자랑하는 자리라, 상장·트로피에 가깝게 위쪽(무엇을 깼고
   *  몇 턴 걸렸는지)은 가운데로 몰아 크게 두고, 아래 상세는 구분선
   *  아래 조용히 깔아 둡니다. */
  .mrcard{
    border:1px solid #6a5528;background:radial-gradient(ellipse at 50% 0%, #1c1810, #14110a 70%);
    padding:26px 24px 22px;box-shadow:0 0 0 1px #000, 0 0 30px rgba(216,178,106,.06) inset;
  }
  .mrhead{text-align:center;padding-bottom:18px;border-bottom:1px solid #3a3020;}
  .mreyebrow{color:#8a7440;font-size:11px;font-weight:700;letter-spacing:.32em;}
  .mrclear{color:#f0d79c;font-weight:800;font-size:22px;letter-spacing:.03em;margin-top:6px;
    text-shadow:0 0 18px rgba(216,178,106,.35);}
  .mrstats{margin-top:10px;display:flex;align-items:baseline;justify-content:center;gap:10px;}
  .mrturn{color:#fff;font-weight:800;font-size:34px;letter-spacing:.01em;}
  .mrcyc{color:#d8b26a;font-size:14px;font-weight:700;}
  .mrbody{margin-top:18px;}
  .mrlabel{color:#8b8681;font-size:11.5px;letter-spacing:.1em;margin:16px 0 6px;}
  .mrbody .mrlabel:first-child{margin-top:0;}
  .mrline{color:#e8e4de;font-size:13.5px;}
  .mrver{color:#6e6a66;font-size:11.5px;margin-top:18px;text-align:right;}
  /* 편성칸 — 이 카드의 진짜 주인공이라, 금테를 둘러 다른 칸과 갈립니다 */
  .mrparty .slot{position:relative;border-color:#5a4826;background:#1a1509;}
  .mrparty .slot .nm{font-size:16px;font-weight:800;color:#f0d79c;}
  /* 클리어 시점의 동기화 단계 — 칸 오른쪽 위 빈자리에 작게 얹습니다 */
  .mrparty .slot .mrsync{
    position:absolute;top:8px;right:10px;color:#8a7440;font-size:10.5px;font-weight:700;
  }

  /* ── 운전석의 접히는 무리 ────────────────────────────────────
   *  갈래가 늘면서 운전석이 한 화면에 안 들어가게 됐습니다.
   *  무리는 접어 두고, 맨 위의 「다음으로 추천」만 펴 둡니다. */
  .csec{border-top:1px solid #23232a;margin-top:14px;}
  .csec .csechead{
    display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;
    padding:11px 2px;color:#e8e4de;font-weight:700;font-size:13.5px;
  }
  .csec .csechead:hover{color:#d8b26a;}
  .csec .csechead b{flex:none;}
  /* 무리마다 곁들이는 한 줄. 좁은 화면에서는 이름과 겹쳐 읽기 어려워 감춥니다. */
  .csec .csechead span{
    color:#6e6a66;font-weight:400;font-size:11.5px;
    min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  @media (max-width:640px){ .csec .csechead span{display:none;} }
  .csec .csechead i{                       /* 접힘 표시 — 펴면 아래를 봅니다 */
    margin-left:auto;width:0;height:0;font-style:normal;
    border-left:4px solid transparent;border-right:4px solid transparent;
    border-top:5px solid #6e6a66;transform:rotate(-90deg);transition:transform .12s;
  }
  .csec.on .csechead i{transform:rotate(0deg);border-top-color:#d8b26a;}
  .csec .csecbody{display:none;padding-bottom:4px;}
  .csec.on .csecbody{display:block;}

  /* 노트의 시너지 한 줄을 누르면 펼쳐지는, 거기 걸리는 사람 목록.
   * 미보유 인격은 흐리게(.un) — 지원 작성위원은 애초에 미보유면 안 실립니다. */
  .synmembers{margin-top:8px;padding-top:8px;border-top:1px dashed #2a2a30;}
  .synmem{font-size:12px;color:#c8c4bc;padding:2px 0;}
  .synmem.un{color:#55524e;}
  .synmem i{font-style:normal;color:#9ccc65;font-size:10.5px;margin-left:4px;}

  /* 다음으로 추천 — 늘 펴져 있고, 금색 테로 한 번 묶습니다 */
  .csrec{border:1px solid #4a3c1c;background:#14110a;padding:11px 12px;margin-top:16px;}
  .csrec .csrechead{color:#d8b26a;font-weight:700;font-size:13.5px;margin-bottom:9px;letter-spacing:.04em;}
  .csrec .csnone{color:#8b8681;font-size:12.5px;line-height:1.7;}
  /* 추천 자리의 이야기 칸에만 붙는 소개 세 줄 (data/story.js 의 pitch) */
  .csrec .slot .csum{margin-top:6px;}
  .csrec .slot .csum span{display:block;color:#a9a49e;font-size:12px;line-height:1.55;}
  .csrec .slot .csum span + span{margin-top:2px;}

  /* ── 거울·거울굴절철도 칸 ────────────────────────────────────
   *  갈래마다 적을 말이 제각각이라 줄글이 길어지던 자리입니다.
   *  이제 «고를 때 필요한 것»만 눈금 셋으로 세우고, 풀어 쓴 말은
   *  들어가기 전 화면으로 넘겼습니다 (engine.js 의 mirrorFacts 참고). */
  .mslot .msub{color:#a9a49e;font-size:11.5px;margin-bottom:7px;}
  .mslot .mstats{display:flex;gap:6px;margin-bottom:7px;}
  /* 칸 너비는 창에 따라 달라지므로(grid 가 210px 부터 늘립니다) 값에 nowrap 을 걸지
   * 않습니다 — 좁아지면 「엔케팔린 / 1」처럼 두 줄로 접히게 두는 편이,
   * 잘려서 「엔케팔…」이 되는 것보다 낫습니다. 셋의 높이는 flex 가 맞춰 줍니다. */
  .mslot .mstats b{
    flex:1;min-width:0;display:block;padding:4px 7px;
    border:1px solid #2f2f37;background:#0e0e13;border-radius:3px;
    color:#e8e4de;font-weight:700;font-size:12px;line-height:1.35;overflow:hidden;
  }
  .mslot .mstats b i{
    display:block;font-style:normal;font-weight:400;
    color:#6e6a66;font-size:10px;letter-spacing:.08em;margin-bottom:1px;
  }
  .mslot .mstats b.bad{border-color:#5e2a28;color:#d9705f;}
  .mslot .mrew{color:#8b8681;font-size:11px;line-height:1.5;}
  .mslot .mrew em{display:block;font-style:normal;color:#d8b26a;}
  .mslot .mrew em.done{color:#5f5b57;}   /* 처음 완주 몫을 이미 받은 갈래 */
  .mslot .mwarn{color:#c8403a;font-size:11px;margin-top:5px;}
  /* ── 노트 ─────────────────────────────── */
  .note{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;}
  .notepic{flex:0 0 auto;}
  .notebody{flex:1 1 320px;min-width:280px;}
  .noteno{color:#7d7a76;font-size:11.5px;letter-spacing:.2em;}
  .notename{color:#e8e4de;font-size:22px;font-weight:800;line-height:1.3;}
  .noteego{color:#c8403a;font-size:12.5px;margin-bottom:10px;}
  .notequote{
    color:#b6b1aa;font-style:italic;border-left:2px solid #4a3a20;
    padding:2px 0 2px 12px;margin:10px 0 14px;
  }
  .noterow{margin:10px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .noterow .k{color:#6e6a66;font-size:11.5px;letter-spacing:.14em;margin-right:4px;}
  .tag2{
    border:1px solid #5a2f2c;background:#1a1010;color:#d99a8f;
    font-size:11px;padding:2px 8px;
  }
  .notebrief{
    color:#a8a49d;font-size:13px;line-height:1.8;background:#101014;
    border:1px solid #2a2a30;padding:12px 14px;margin:12px 0 16px;
  }

  .modalfoot{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .dl{
    display:inline-block;background:#16161b;border:1px solid #7a2b28;color:#e6b0ac;
    font-family:inherit;font-size:13.5px;padding:7px 15px;text-decoration:none;cursor:pointer;
  }
  .dl:hover{background:#1e1e25;color:#fff;}
  /* ── 전투 중 ───────────────────────────────
   *  전투에 들어가면 <body> 에 battling 이 붙습니다 (engine.js 의 render).
   *  화면 전체가 붉게 가라앉아, 이야기 화면과 한눈에 구분됩니다.
   *  색만 바꾸는 것이라 아래 값만 고치면 분위기가 통째로 달라집니다.
   */
  body.battling{background:#0d0708;}

  body.battling header{border-bottom-color:#7a2b28;}
  body.battling header .brand{color:#e05048;}
  body.battling header .chap{color:#9c8480;}
  body.battling header .right{color:#b09490;}
  .fighting{
    border:1px solid #7a2b28;background:#2a1012;color:#f0a49c;
    font-size:11px;letter-spacing:.2em;font-weight:700;padding:1px 8px;margin-right:10px;
  }

  body.battling #stage{border-color:#4a2226;background:#140b0d;}
  body.battling #stage img.scene{background:#100809;}
  body.battling #stage .placename{border-top-color:#4a2226;}

  body.battling #log{border-color:#6e2a2c;background:#160c0e;}
  body.battling #log .divider{border-top-color:#3d1f22;}
  body.battling #log .n  {color:#cbbdb9;}
  body.battling #log .sys{color:#8a706c;}

  body.battling .pcard{border-color:#402326;background:#1a1012;}
  /* 전투 중에도 네 가지는 서로 다른 색을 지킵니다.
   * 예전에는 «차례»와 «노려짐»이 둘 다 붉게 덮여 구분이 되지 않았습니다. */
  body.battling .pcard.acting    {border-color:#5ec26a;box-shadow:inset 0 0 0 1px #24502a;}
  body.battling .pcard.cmd-attack{border-color:#e07aa8;box-shadow:inset 0 0 0 1px #5a2a3e;}
  body.battling .pcard.cmd-guard {border-color:#5aa8e0;box-shadow:inset 0 0 0 1px #234156;}
  body.battling .pcard.aimed{background:#25100f;}
  body.battling .pcard.sup{border-left-color:#9ccc65;}
  body.battling .pcard .id{color:#9c8480;}
  body.battling .pcard .st{color:#9c8480;}
  body.battling .hpbar{background:#2c191b;border-color:#4a2226;}
  body.battling .hpbar i{background:#b04a42;}

  body.battling button{background:#1e1214;border-color:#4e2c2e;color:#d8c8c4;}
  body.battling button:hover:not(:disabled){background:#2a1a1c;border-color:#e05048;color:#fff;}
  body.battling button.primary{border-color:#9c3a34;color:#f0b8b2;}
  body.battling button.ghost{border-color:#3a2226;color:#96807c;}

  /* 그림칸 높이는 화면 크기에 따라서만 달라집니다. 그림 크기는 보지 않습니다. */
  @media (max-width:900px){
    :root{ --stageh:250px; }
  }
  /* ── 튜토리얼 ──────────────────────────
   *  화면 전체를 반투명한 막으로 덮고, 짚어 줄 곳만 뚫어 놓습니다.
   *  뚫는 몫은 .tutring 하나가 겸합니다 — 테두리를 두르고, 바깥쪽으로
   *  아주 큰 box-shadow 를 뿌려 그 그림자가 곧 막이 됩니다.
   *  막을 따로 한 겹 깔고 구멍을 오려 내는 것보다 어긋날 일이 없습니다.
   *
   *  누름은 #tut 이 전부 받습니다 (안쪽은 pointer-events:none).
   *  그래야 「아무 데나 눌러 다음」이 되고, 밑의 손잡이가 잘못 눌리지 않습니다.
   */
  #tut{
    position:fixed;inset:0;z-index:60;
    background:rgba(0,0,0,0);          /* 막은 아래 .tutring 의 그림자가 냅니다 */
    -webkit-tap-highlight-color:transparent;
  }
  /* 가리킬 곳이 없는 줄 — 이때는 이 바탕색이 그대로 막이 됩니다 */
  #tut.plain{background:rgba(8,8,11,.78);}
  #tut > *{pointer-events:none;}
  #tut .tutring{
    position:fixed;border:2px solid #d8b26a;border-radius:3px;
    box-shadow:0 0 0 9999px rgba(8,8,11,.78), inset 0 0 14px rgba(216,178,106,.35);
    animation:tutring 1.6s ease-in-out infinite;
  }
  @keyframes tutring{
    0%,100%{border-color:#d8b26a;}
    50%    {border-color:#f7e6bd;}
  }
  /* 회색 상자에 흰 글씨 */
  #tut .tutbox{
    position:fixed;max-width:340px;
    background:#33333a;border:1px solid #55555f;
    color:#ffffff;font-size:13.5px;line-height:1.7;
    padding:11px 14px 9px;
    box-shadow:0 8px 26px rgba(0,0,0,.6);
  }
  #tut .tutbox .tuttext{color:#ffffff;}
  #tut .tutbox .tutfoot{
    display:flex;align-items:baseline;gap:10px;
    margin-top:7px;padding-top:6px;border-top:1px solid #4a4a54;
    color:#b9b6b1;font-size:11px;letter-spacing:.04em;
  }
  #tut .tutbox .tutnum{margin-left:auto;color:#d8b26a;font-weight:700;}
  /* 상자에 붙는 화살촉 — 짚는 곳 쪽으로 뻗습니다 */
  #tut .tutbox .tutarrow{position:absolute;width:0;height:0;}
  #tut .tutbox.below .tutarrow{
    top:-9px;border-left:9px solid transparent;border-right:9px solid transparent;
    border-bottom:9px solid #55555f;
  }
  #tut .tutbox.above .tutarrow{
    bottom:-9px;border-left:9px solid transparent;border-right:9px solid transparent;
    border-top:9px solid #55555f;
  }
  /* 건너뛰기 — 여기만 누름을 따로 받습니다 */
  #tut .tutskip{
    position:fixed;right:12px;top:12px;pointer-events:auto;cursor:pointer;
    background:#1a1a20;border:1px solid #4a4a54;color:#b9b6b1;
    font-size:11.5px;letter-spacing:.08em;padding:5px 11px;
  }
  #tut .tutskip:hover{border-color:#c8403a;color:#e8e4de;}
  /* 노트 안 튜토리얼 목록 — 한 줄에 하나씩 */
  .tutrow{border-left:3px solid #4a4a54;}
  .tutrow.done{border-left-color:#4a3a20;}
  .tutrow .tutwhen{color:#6e6a66;font-size:11px;}
  .tutrow .tutline{color:#a8a49d;font-size:12px;line-height:1.65;}
  .tutrow .tutline b{color:#d8b26a;font-weight:700;}

  /* ── 좁은 화면 (휴대전화) ──────────────────
   *  전투 화면이 한 눈에 들어오도록, 보여 주는 것을 줄입니다.
   *    · 그림칸과 글상자를 낮추고
   *    · 파티 카드는 셋을 나란히, 체력만 남기고
   *    · 관리자 능력 설명줄과 시너지 설명은 감춥니다
   *  숫자를 다시 보고 싶으면 아래 display:none 줄을 지우면 됩니다.
   */
  @media (max-width:640px){
    :root{ --stageh:150px; }
    #app{padding:10px 10px 28px;}
    header{gap:8px;padding-bottom:6px;margin-bottom:8px;}
    header .brand{font-size:14px;letter-spacing:.14em;}
    header .chap{display:none;}                 /* 장 제목은 접습니다 */

    #log{height:180px;padding:11px 13px;font-size:14px;}
    #log p{margin:0 0 6px;}
    #log .divider{margin:8px 0;}

    #party{grid-template-columns:repeat(3,1fr);gap:5px;}
    /* 좁은 화면에서 넷을 한 줄에 넣으면 글씨가 뭉개집니다 — 둘씩 두 줄로 */
    #party.four{grid-template-columns:repeat(2,1fr);}
    .pcard{padding:6px 7px;font-size:12px;}
    .pcard .nm{font-size:12.5px;}
    .pcard .id{display:none;}                   /* 장착한 인격 이름 */
    .pcard .ostat{display:none;}                /* 공·방 수치 */
    .pcard .st{font-size:11px;}
    .pcard .cmd{font-size:11px;}

    #synergy{gap:4px;margin-top:6px;}
    .syn .eff, .adv, .gift{display:none;}       /* 시너지 효과·교육위원·기프트 딱지 */
    .syn{font-size:10.5px;padding:2px 7px;}

    #manage{margin-top:6px;}
    .mgwrap{padding:5px 9px;font-size:11px;gap:7px;}
    .mgwrap .mgsub{display:none;}               /* 회복 안내 */
    .mgskills{display:none;}                    /* 능력 설명줄 넷 */
    .mgwrap .mgpips i{width:13px;height:9px;}

    #enk{margin-top:6px;}
    .enkwrap{font-size:11px;padding:5px 9px;}

    #actions{margin-top:8px;gap:5px;}
    button{font-size:12.5px;padding:6px 10px;}

    .card img{max-width:120px;max-height:160px;}
    .sheet{padding:14px 13px;}
    .grid{grid-template-columns:1fr;}
    /* 셋을 나란히 세우는 규칙은 여기서 풀립니다 — 좁은 화면에서는 한 줄에 하나씩 */
    .grid.three{grid-template-columns:1fr;}
    /* 배정 광고 띠도 화면에 맞춰 낮춥니다 */
    .pkline{height:92px;font-size:16px;letter-spacing:.06em;padding:0 10px;}
    .pkline.small{height:46px;}
    .pkline.small span{font-size:15px;}
    /* 가로 통째 칸도 좁은 화면에서는 띠를 낮춥니다 */
    .slot.wide .pkline{height:104px;}
    /* 튜토리얼 상자 — 좁은 화면에서는 좌우 여백만 남기고 가로를 다 씁니다 */
    #tut .tutbox{max-width:none;width:calc(100vw - 24px);font-size:13px;padding:10px 12px 8px;}
    #tut .tutskip{right:10px;top:10px;font-size:11px;padding:4px 9px;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="brand">라슈 컴퍼니</span>
    <span class="chap" id="chaplabel"></span>
    <span class="right" id="wallet"></span>
  </header>

  <div id="foehp"></div>
  <div id="stage"></div>
  <div id="log"></div>
  <div id="party"></div>
  <div id="synergy"></div>
  <div id="manage"></div>
  <div id="enk"></div>
  <div id="actions"></div>
  <div id="uniqueskills" class="mgskills uskillbox"></div>
</div>

<div id="modal"><div class="sheet" id="sheet"></div></div>

<script src="data/access.js?v=1.11.2"></script>
<script src="data/vault.js?v=1.11.2"></script>
<script src="data/characters.js?v=1.11.2"></script>
<script src="data/skills.js?v=1.11.2"></script>
<script src="data/allies.js?v=1.11.2"></script>
<script src="data/gifts.js?v=1.11.2"></script>
<script src="data/pickup.js?v=1.11.2"></script>
<script src="data/achievements.js?v=1.11.2"></script>
<script src="data/mail.js?v=1.11.2"></script>
<script src="data/notice.js?v=1.11.2"></script>
<script src="data/patch.js?v=1.11.2"></script>
<script src="data/event.js?v=1.11.2"></script>
<script src="data/tutorial.js?v=1.11.2"></script>
<script src="data/story.js?v=1.11.2"></script>
<script src="data/mirrorpacks.js?v=1.11.2"></script>

<script>
/* 데이터 파일을 못 읽은 경우에 대비한 안내 */
if (typeof CHAPTERS === "undefined" || typeof SINNERS === "undefined") {
  document.getElementById("log").innerHTML =
    '<p class="bad">데이터 파일을 읽지 못했습니다.</p>' +
    '<p class="sys">index.html 과 같은 폴더에 engine.js, data/ 폴더가 함께 있어야 합니다.</p>' +
    '<p class="sys">그래도 안 되면 같은 폴더의 <b>라슈컴퍼니_단일파일.html</b> 을 여세요. ' +
    '(모든 것이 한 파일에 들어 있어 반드시 실행됩니다)</p>';
}
</script>
</body>
</html>
