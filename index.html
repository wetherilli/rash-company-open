<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>라슈 컴퍼니</title>
<style>
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;background:#0a0a0c;color:#d6d3ce;
    font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    font-size:15px;line-height:1.75;
  }
  #app{max-width:960px;margin:0 auto;padding:14px 14px 40px;}

  /* ── 머리 ─────────────────────────────── */
  header{
    display:flex;align-items:baseline;gap:14px;
    border-bottom:1px solid #3a2226;padding-bottom:8px;margin-bottom:12px;
  }
  header .brand{color:#c8403a;font-weight:800;letter-spacing:.22em;font-size:17px;}
  header .chap{color:#7d7a76;font-size:12.5px;letter-spacing:.08em;}
  header .right{margin-left:auto;color:#8b8681;font-size:12.5px;}
  header .right b{color:#d8b26a;font-weight:600;}

  /* ── 무대(이미지) ───────────────────────
   *  그림칸의 세로 폭은 --stageh 로 고정됩니다.
   *  가로로 긴 배경이든 세로로 긴 초상이든 칸 크기는 그대로고,
   *  그림만 안에서 잘리지 않게 맞춰집니다 (object-fit:contain).
   *  높이를 바꾸고 싶으면 아래 --stageh 한 줄만 고치세요.
   */
  :root{ --stageh:300px; }
  #stage{display:none;border:1px solid #2a2a30;background:#0b0b0f;margin-bottom:10px;overflow:hidden;}
  #stage.on{display:block;}
  /* 배경 한 겹, 그 위에 사람 한 겹 */
  .scenebox{position:relative;height:var(--stageh);overflow:hidden;background:#08080b;}
  .scenebox img.scene{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9;
  }
  .scenebox img.scene.fit{object-fit:contain;opacity:1;}
  /* 흰 종이에 그린 그림은 칸 바탕도 흰색으로 — 검은 여백이 생기지 않게 */
  .scenebox.paper{background:#f2efe9;}
  .scenebox.paper .placename{
    color:#5a5148;background:linear-gradient(to top, rgba(242,239,233,.95), rgba(242,239,233,0));
  }
  .scenebox .figwrap{
    position:absolute;inset:0;display:flex;align-items:flex-end;padding:0 3%;
  }
  .scenebox .figwrap.left{justify-content:flex-start;}   /* 대사하는 사람 */
  .scenebox .figwrap.mid {justify-content:center;}       /* 적 */
  .scenebox .figwrap img{
    height:96%;width:auto;max-width:52%;object-fit:contain;
    filter:drop-shadow(0 5px 12px rgba(0,0,0,.6));
  }
  .scenebox .figwrap.mid img{max-width:74%;}
  /* 맞을 때 — 참격이 한 번 그어진다 */
  .scenebox .slashfx{
    position:absolute;left:50%;top:50%;
    height:108%;width:auto;pointer-events:none;z-index:3;
    filter:drop-shadow(0 0 10px rgba(255,240,220,.75));
    animation:slashfx 420ms ease-out forwards;
  }
  @keyframes slashfx{
    0%  {opacity:0;  transform:translate(-50%,-50%) scale(.62) rotate(-14deg);}
    18% {opacity:1;  transform:translate(-50%,-50%) scale(1.02) rotate(-4deg);}
    55% {opacity:.95;transform:translate(-50%,-50%) scale(1.10) rotate(-1deg);}
    100%{opacity:0;  transform:translate(-50%,-50%) scale(1.22) rotate(2deg);}
  }
  /* 맞을 때 — 적이 좌우로 흔들리며 점멸한다 */
  .scenebox .figwrap img.hit{animation:foehit 420ms steps(1,end);}
  @keyframes foehit{
    0%  {transform:translateX(0);   opacity:1;}
    10% {transform:translateX(-9px);opacity:.3;}
    22% {transform:translateX(8px); opacity:1;}
    34% {transform:translateX(-7px);opacity:.35;}
    46% {transform:translateX(6px); opacity:1;}
    58% {transform:translateX(-4px);opacity:.5;}
    70% {transform:translateX(3px); opacity:1;}
    84% {transform:translateX(-2px);opacity:.8;}
    100%{transform:translateX(0);   opacity:1;}
  }
  /* 쓰러질 때 — 깜빡이다 살짝 내려앉으며 사라진다 */
  .scenebox .figwrap img.gone{animation:foefall 1.1s steps(1,end) forwards;}
  @keyframes foefall{
    0%{opacity:1;transform:translateY(0);}
    8%{opacity:.1;}  16%{opacity:1;}
    24%{opacity:.1;} 32%{opacity:1;}
    40%{opacity:.1;} 48%{opacity:1;}
    56%{opacity:.6;transform:translateY(6px);}
    72%{opacity:.35;transform:translateY(16px);}
    100%{opacity:0;transform:translateY(30px);}
  }
  /* 지명은 칸 안쪽 아래에 얹습니다 — 칸 높이는 늘 --stageh 그대로 */
  .scenebox .placename{
    position:absolute;left:0;right:0;bottom:0;
    color:#d8b26a;letter-spacing:.16em;font-size:12.5px;padding:7px 12px;
    background:linear-gradient(to top, rgba(6,6,9,.92), rgba(6,6,9,0));
  }
  /* 초상은 흰 바탕이라 살짝 눌러 준다 */
  .card{background:#efeae1;border:1px solid #cabfae;padding:8px;flex:0 0 auto;}
  .card img{display:block;max-width:190px;max-height:250px;width:auto;height:auto;}
  .card .tag{
    color:#5a5148;font-size:11px;letter-spacing:.12em;text-align:center;
    padding-top:6px;border-top:1px solid #cabfae;margin-top:6px;
  }

  /* ── 로그 ─────────────────────────────── */
  #log{
    border:1px solid #2a2a30;background:#0e0e12;height:330px;overflow-y:auto;
    padding:16px 18px;
  }
  #log p{margin:0 0 9px;}
  #log .n     {color:#c2bfba;}
  #log .who   {color:#c8403a;font-weight:700;font-size:13px;letter-spacing:.06em;margin-bottom:1px;}
  #log .d     {color:#e8e4de;padding-left:2px;}
  #log .sys   {color:#6e6a66;font-size:13px;}
  #log .good  {color:#7fa86a;}
  #log .bad   {color:#c8403a;}
  #log .hit   {color:#ddd8d2;font-size:14px;}
  #log .gain  {color:#d8b26a;}
  #log .place {color:#d8b26a;letter-spacing:.18em;font-size:13px;margin:14px 0 8px;}
  #log .todo  {color:#55524e;font-style:italic;font-size:13px;border-left:2px solid #333;padding-left:10px;}
  #log .recall{color:#8a7fa8;}
  #log.recalling{background:#0d0b12;}
  #log .divider{border-top:1px solid #26262c;margin:12px 0;}

  /* ── 파티 ─────────────────────────────── */
  #party{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;}
  /* 왼쪽 띠는 «누구인가» 를 말합니다 — 작성위원은 파랑, 지원은 연두.
     테두리 색은 «지금 무엇을 하는가» 를 말합니다. 둘은 겹치지 않습니다. */
  .pcard{
    position:relative;border:1px solid #2a2a30;border-left:4px solid #4a6d92;
    background:#101014;padding:9px 10px;font-size:13px;
  }
  .pcard.down{opacity:.4;}
  /* 지금 명령을 고르는 사람 — 초록 */
  .pcard.acting{border-color:#5ec26a;box-shadow:inset 0 0 0 1px #1e4023;}
  /* 공격을 고른 사람 — 분홍 */
  .pcard.cmd-attack{border-color:#e07aa8;box-shadow:inset 0 0 0 1px #4a2233;}
  /* 방어를 고른 사람 — 파랑 */
  .pcard.cmd-guard {border-color:#5aa8e0;box-shadow:inset 0 0 0 1px #1c3547;}
  /* 적이 노리는 사람 — 붉은 점선. 테두리와 겹쳐도 보이도록 바깥에 두른다 */
  .pcard.aimed{background:#170e10;}
  .pcard.aimed::after{
    content:"";position:absolute;inset:-3px;border:2px dashed #c8403a;pointer-events:none;
  }
  /* 지원 작성위원 — 연두 */
  .pcard.sup{background:#101a10;border-left-color:#9ccc65;}
  .pcard .suptag {color:#9ccc65;font-size:11px;letter-spacing:.06em;}
  .pcard .aimtag  {color:#c8403a;font-size:11px;letter-spacing:.06em;}
  .pcard .turntag {color:#5ec26a;font-size:11px;letter-spacing:.1em;}
  .pcard .readytag{color:#b9b4ae;font-size:11px;letter-spacing:.06em;}
  .pcard.cmd-attack .readytag{color:#e07aa8;}
  .pcard.cmd-guard  .readytag{color:#5aa8e0;}
  /* 적에게 맞을 때 화면이 흔들립니다. 강타면 크게. */
  #app.shake{animation:shake 320ms ease-in-out;}
  #app.shakehard{animation:shakehard 620ms ease-in-out;}
  @keyframes shake{
    0%,100%{transform:translate(0,0);}
    15%{transform:translate(-4px,2px);}   35%{transform:translate(4px,-2px);}
    55%{transform:translate(-3px,1px);}   75%{transform:translate(2px,-1px);}
  }
  @keyframes shakehard{
    0%,100%{transform:translate(0,0) rotate(0);}
    8%{transform:translate(-11px,5px) rotate(-.5deg);}
    20%{transform:translate(10px,-6px) rotate(.5deg);}
    32%{transform:translate(-9px,4px) rotate(-.4deg);}
    46%{transform:translate(8px,-4px) rotate(.35deg);}
    60%{transform:translate(-6px,3px) rotate(-.25deg);}
    74%{transform:translate(4px,-2px) rotate(.15deg);}
    88%{transform:translate(-2px,1px) rotate(0);}
  }
  .slot .synon{color:#d8b26a;font-size:11px;letter-spacing:.06em;font-weight:400;}

  /* ── 인격 장착 — 접었다 폈다 ──────────── */
  .eqbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 4px;}
  .eqchk{display:inline-flex;align-items:center;gap:6px;color:#c9c5c0;font-size:13px;cursor:pointer;}
  .eqchk input{accent-color:#c8403a;width:15px;height:15px;cursor:pointer;}
  .eqhead{
    display:flex;align-items:baseline;gap:9px;cursor:pointer;
    border:1px solid #2a2a30;background:#131318;padding:8px 11px;margin-top:8px;
  }
  .eqhead:hover{border-color:#c8403a;}
  .eqhead.open{border-color:#4a3a20;background:#17150f;}
  .eqhead .arrow{color:#d8b26a;font-size:12px;width:12px;}
  .eqhead b{color:#e8e4de;}
  .eqhead .wearing{color:#8b8681;font-size:12px;}
  .eqhead .cnt{margin-left:auto;color:#6e6a66;font-size:11.5px;}
  .eqbody{margin-top:6px;}
  .pcard .nm{color:#e8e4de;font-weight:700;}
  .pcard .id{color:#8b8681;font-size:11.5px;margin:1px 0 5px;}
  .pcard .st{color:#7d7a76;font-size:11.5px;}
  .pcard .cmd{color:#d8b26a;font-size:11.5px;}
  .pcard.cmd-attack .cmd{color:#e07aa8;}
  .pcard.cmd-guard  .cmd{color:#5aa8e0;}
  .hpbar{height:7px;background:#241a1c;border:1px solid #3a2226;margin:3px 0;}
  .hpbar i{display:block;height:100%;background:#8d3b36;}
  .star{color:#d8b26a;letter-spacing:-1px;}

  /* ── 시너지 ───────────────────────────── */
  #synergy{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  #synergy .none{color:#4e4b47;font-size:11.5px;letter-spacing:.05em;}
  .syn{
    border:1px solid #4a3a20;background:#171208;color:#d8b26a;
    font-size:11.5px;padding:3px 9px;display:inline-flex;gap:7px;align-items:center;
  }
  .syn b{font-weight:700;}
  .syn .cnt{color:#8a7440;}
  .syn .eff{color:#b9945a;}
  .adv{
    border:1px solid #3a3550;background:#14121c;color:#a99ad0;
    font-size:11.5px;padding:3px 9px;display:inline-flex;gap:6px;align-items:center;
  }
  .gift{
    border:1px solid #24503f;background:#0d1712;color:#7fc0a0;
    font-size:11.5px;padding:3px 9px;display:inline-flex;gap:6px;align-items:center;
  }
  #log .crit{color:#f0c46a;font-weight:700;}
  #log .heavy{color:#f05a50;font-weight:700;font-size:14.5px;}
  body.battling #log .heavy{color:#ff6a5e;}
  .syn.full{border-color:#7a5c22;background:#1e1608;box-shadow:0 0 0 1px #3a2a10 inset;}

  /* ── 버튼 ─────────────────────────────── */
  /* ── 엔케팔린 눈금 ────────────────────── */
  #enk{margin-top:10px;}
  #enk:empty{margin-top:0;}
  .enkwrap{
    display:flex;align-items:center;gap:9px;flex-wrap:wrap;
    border:1px solid #2a2a30;background:#101014;padding:7px 11px;font-size:12px;
  }
  .enkwrap .enknm{color:#6f8fa8;letter-spacing:.14em;font-weight:700;}
  .enkwrap .enkpips{display:flex;gap:3px;}
  .enkwrap .enkpips i{
    display:block;width:13px;height:9px;background:#181a20;border:1px solid #2f3742;
  }
  .enkwrap .enkpips i.on{background:#4f7f9c;border-color:#6f9fbb;}
  .enkwrap .enknum{color:#cfe0ea;font-weight:700;}
  .enkwrap .enksub{color:#6e6a66;margin-left:auto;}

  /* ── 관리력 눈금 ──────────────────────── */
  #manage{margin-top:10px;}
  #manage:empty{margin-top:0;}
  .mgwrap{
    display:flex;align-items:center;gap:9px;flex-wrap:wrap;
    border:1px solid #5a3a1c;background:#171008;padding:7px 11px;font-size:12px;
  }
  .mgwrap .mgnm{color:#d8b26a;letter-spacing:.16em;font-weight:700;}
  .mgwrap .mgpips{display:flex;gap:4px;}
  .mgwrap .mgpips i{
    display:block;width:17px;height:11px;background:#1d1810;border:1px solid #4a3a20;
  }
  .mgwrap .mgpips i.on{background:#d8b26a;border-color:#f0d094;}
  .mgwrap .mgnum{color:#f0d79c;font-weight:700;}
  .mgwrap .mgsub{color:#8a7440;margin-left:auto;}
  .mgskills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .mgsk{
    border:1px solid #3a2f1a;background:#12100a;color:#a89468;
    font-size:11.5px;padding:2px 9px;display:inline-flex;gap:7px;align-items:baseline;
  }
  .mgsk b{color:#e8c98a;font-weight:700;}
  .mgsk i{color:#8a7440;font-style:normal;font-size:11px;}
  .mgsk.off{opacity:.42;}

  #actions{margin-top:12px;display:flex;flex-wrap:wrap;gap:7px;}
  button{
    background:#16161b;border:1px solid #34343c;color:#c9c5c0;
    font-family:inherit;font-size:13.5px;padding:7px 15px;cursor:pointer;
  }
  button:hover:not(:disabled){background:#1e1e25;border-color:#c8403a;color:#fff;}
  button:disabled{opacity:.35;cursor:default;}
  button.primary{border-color:#7a2b28;color:#e6b0ac;}
  button.ghost{border-color:#2a2a30;color:#7d7a76;}
  .codein{
    background:#0b0b0f;border:1px solid #34343c;color:#e8e4de;
    font-family:inherit;font-size:14px;padding:7px 12px;min-width:180px;outline:none;
    letter-spacing:.1em;
  }
  .codein:focus{border-color:#c8403a;}
  /* 출입 코드 화면 — 칸과 손잡이를 가운데로 */
  #actions.mid{justify-content:center;}
  #actions.mid .codein{text-align:center;letter-spacing:.24em;}

  /* ── 패치 노트 ──────────────────────────── */
  .patch{border:1px solid #2a2a30;background:#101014;padding:11px 14px;margin:10px 0;}
  .patch.now{border-color:#7a5c22;background:#17150f;}
  .patch .pv{color:#d8b26a;font-weight:700;letter-spacing:.08em;font-size:13.5px;}
  .patch .pv .pd{color:#6e6a66;font-weight:400;font-size:11.5px;margin-left:10px;letter-spacing:0;}
  .patch .pl{margin:7px 0 0;padding-left:18px;color:#c2bfba;font-size:13px;line-height:1.75;}
  .patch .pl li{margin:0 0 3px;}

  /* ── 특정 배정 광고 문구 ─────────────────
   *  문구 자체는 data/pickup.js 의 line 에서 갈아 끼웁니다. */
  .pkline{
    position:relative;overflow:hidden;
    border:1px solid #7a5c22;background:linear-gradient(90deg,#241a08,#1a1408 60%,#241a08);
    color:#f0d79c;font-size:22px;font-weight:700;letter-spacing:.1em;
    padding:0 14px;margin:2px 0 12px;text-align:center;
    height:124px;display:flex;align-items:center;justify-content:center;
  }
  /* 그림을 깔았을 때 — 고르게 눌러서 글씨가 읽히게 한다 */
  .pkline.pic{
    background-size:cover;background-position:center 42%;
    text-shadow:0 2px 10px #000, 0 0 18px rgba(0,0,0,.9);
  }
  .pkline.pic::before{content:"";position:absolute;inset:0;background:rgba(8,6,4,.5);}
  .pkline span{position:relative;}
  /* 상점 칸 머리의 작은 띠 — 글씨 없이 그림만. 칸 크기를 서로 맞추는 몫입니다. */
  .pkline.small{
    height:56px;margin:0 0 8px;padding:0;letter-spacing:0;
    border-color:#3a3a44;
  }
  .pkline.small::before{background:rgba(8,6,4,.28);}
  .slot.pk .pkline.small{border-color:#7a5c22;}
  .slot.pk{border-color:#7a5c22;background:#171208;}

  /* ── 배정에서 ★★★ 이 나왔을 때 ──────────
   *  결과를 펼치기 전에 화면이 한 번 크게 빛납니다. */
  .flashfx{
    position:fixed;inset:0;z-index:40;pointer-events:none;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 50%, rgba(216,178,106,.30), rgba(0,0,0,.88) 62%);
    animation:flashbg 900ms ease-out forwards;
  }
  /* 빛이 터진 뒤 — 누를 때까지 머문다 */
  .flashfx.hold{pointer-events:auto;cursor:pointer;}
  @keyframes flashbg{
    0%{opacity:0;} 12%{opacity:1;} 100%{opacity:1;}
  }
  .flashfx .ring{
    position:absolute;width:70px;height:70px;border-radius:50%;
    border:2px solid #f0d79c;box-shadow:0 0 40px 12px rgba(240,215,156,.55);
    animation:flashring 900ms cubic-bezier(.15,.7,.3,1) forwards;
  }
  @keyframes flashring{
    0%{transform:scale(.2);opacity:0;}
    16%{opacity:1;}
    100%{transform:scale(11);opacity:0;}
  }
  .flashfx .beam{
    position:absolute;width:210%;height:3px;background:#f6e6bd;
    box-shadow:0 0 26px 7px rgba(246,230,189,.75);
    animation:flashbeam 900ms ease-out forwards;
  }
  @keyframes flashbeam{
    0%{transform:scaleX(0);opacity:0;}
    18%{transform:scaleX(1);opacity:1;}
    52%{opacity:.9;}
    100%{transform:scaleX(1);opacity:0;}
  }
  .flashfx .txt{
    position:relative;color:#f6e6bd;font-size:48px;letter-spacing:.1em;text-align:center;
    text-shadow:0 0 24px rgba(246,230,189,.9);
    animation:flashtxt 900ms ease-out forwards;
  }
  /* 인격에 적힌 짧은 설명 한 줄 */
  .flashfx .txt .line{
    margin-top:14px;font-size:17px;letter-spacing:.04em;color:#e8dcc0;
    font-style:italic;text-shadow:0 0 14px rgba(246,230,189,.6);
    max-width:80vw;line-height:1.7;
  }
  @keyframes flashtxt{
    0%{transform:scale(.4);opacity:0;}
    30%{transform:scale(1.08);opacity:1;}
    100%{transform:scale(1);opacity:1;}
  }
  /* 「눌러서 계속」 — 빛이 잦아든 뒤에 조용히 떠오른다 */
  .flashfx .tap{
    position:absolute;left:0;right:0;bottom:14%;
    text-align:center;color:#bda978;font-size:13px;letter-spacing:.22em;
    opacity:0;
  }
  .flashfx.hold .tap{animation:flashtap 1.6s ease-in-out .1s infinite;}
  @keyframes flashtap{
    0%{opacity:0;} 28%{opacity:.95;} 70%{opacity:.95;} 100%{opacity:0;}
  }

  /* ── 모달 ─────────────────────────────── */
  #modal{
    display:none;position:fixed;inset:0;background:#000000d0;z-index:20;
    overflow-y:auto;padding:26px 14px;
  }
  #modal.on{display:block;}
  .sheet{max-width:900px;margin:0 auto;background:#0e0e12;border:1px solid #34343c;padding:18px 20px;}
  .sheet h2{margin:0 0 4px;color:#c8403a;font-size:16px;letter-spacing:.14em;}
  .sheet .hint{color:#6e6a66;font-size:12.5px;margin-bottom:14px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;}
  .slot{border:1px solid #2a2a30;background:#121218;padding:9px 11px;cursor:pointer;font-size:13px;}
  .slot:hover{border-color:#c8403a;}
  .slot.sel{border-color:#d8b26a;background:#17151a;}
  .slot .nm{color:#e8e4de;font-weight:700;}
  .slot .sub{color:#8b8681;font-size:11.5px;}
  .slot .lock{color:#55524e;font-size:11.5px;}
  /* ── 노트 ─────────────────────────────── */
  .note{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;}
  .notepic{flex:0 0 auto;}
  .notebody{flex:1 1 320px;min-width:280px;}
  .noteno{color:#7d7a76;font-size:11.5px;letter-spacing:.2em;}
  .notename{color:#e8e4de;font-size:22px;font-weight:800;line-height:1.3;}
  .noteego{color:#c8403a;font-size:12.5px;margin-bottom:10px;}
  .notequote{
    color:#b6b1aa;font-style:italic;border-left:2px solid #4a3a20;
    padding:2px 0 2px 12px;margin:10px 0 14px;
  }
  .noterow{margin:10px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .noterow .k{color:#6e6a66;font-size:11.5px;letter-spacing:.14em;margin-right:4px;}
  .tag2{
    border:1px solid #5a2f2c;background:#1a1010;color:#d99a8f;
    font-size:11px;padding:2px 8px;
  }
  .notebrief{
    color:#a8a49d;font-size:13px;line-height:1.8;background:#101014;
    border:1px solid #2a2a30;padding:12px 14px;margin:12px 0 16px;
  }

  .modalfoot{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .dl{
    display:inline-block;background:#16161b;border:1px solid #7a2b28;color:#e6b0ac;
    font-family:inherit;font-size:13.5px;padding:7px 15px;text-decoration:none;cursor:pointer;
  }
  .dl:hover{background:#1e1e25;color:#fff;}
  /* ── 전투 중 ───────────────────────────────
   *  전투에 들어가면 <body> 에 battling 이 붙습니다 (engine.js 의 render).
   *  화면 전체가 붉게 가라앉아, 이야기 화면과 한눈에 구분됩니다.
   *  색만 바꾸는 것이라 아래 값만 고치면 분위기가 통째로 달라집니다.
   */
  body.battling{background:#0d0708;}

  body.battling header{border-bottom-color:#7a2b28;}
  body.battling header .brand{color:#e05048;}
  body.battling header .chap{color:#9c8480;}
  body.battling header .right{color:#b09490;}
  .fighting{
    border:1px solid #7a2b28;background:#2a1012;color:#f0a49c;
    font-size:11px;letter-spacing:.2em;font-weight:700;padding:1px 8px;margin-right:10px;
  }

  body.battling #stage{border-color:#4a2226;background:#140b0d;}
  body.battling #stage img.scene{background:#100809;}
  body.battling #stage .placename{border-top-color:#4a2226;}

  body.battling #log{border-color:#6e2a2c;background:#160c0e;}
  body.battling #log .divider{border-top-color:#3d1f22;}
  body.battling #log .n  {color:#cbbdb9;}
  body.battling #log .sys{color:#8a706c;}

  body.battling .pcard{border-color:#402326;background:#1a1012;}
  /* 전투 중에도 네 가지는 서로 다른 색을 지킵니다.
   * 예전에는 «차례»와 «노려짐»이 둘 다 붉게 덮여 구분이 되지 않았습니다. */
  body.battling .pcard.acting    {border-color:#5ec26a;box-shadow:inset 0 0 0 1px #24502a;}
  body.battling .pcard.cmd-attack{border-color:#e07aa8;box-shadow:inset 0 0 0 1px #5a2a3e;}
  body.battling .pcard.cmd-guard {border-color:#5aa8e0;box-shadow:inset 0 0 0 1px #234156;}
  body.battling .pcard.aimed{background:#25100f;}
  body.battling .pcard.sup{border-left-color:#9ccc65;}
  body.battling .pcard .id{color:#9c8480;}
  body.battling .pcard .st{color:#9c8480;}
  body.battling .hpbar{background:#2c191b;border-color:#4a2226;}
  body.battling .hpbar i{background:#b04a42;}

  body.battling button{background:#1e1214;border-color:#4e2c2e;color:#d8c8c4;}
  body.battling button:hover:not(:disabled){background:#2a1a1c;border-color:#e05048;color:#fff;}
  body.battling button.primary{border-color:#9c3a34;color:#f0b8b2;}
  body.battling button.ghost{border-color:#3a2226;color:#96807c;}

  /* 그림칸 높이는 화면 크기에 따라서만 달라집니다. 그림 크기는 보지 않습니다. */
  @media (max-width:900px){
    :root{ --stageh:250px; }
  }
  /* ── 좁은 화면 (휴대전화) ──────────────────
   *  전투 화면이 한 눈에 들어오도록, 보여 주는 것을 줄입니다.
   *    · 그림칸과 글상자를 낮추고
   *    · 파티 카드는 셋을 나란히, 체력만 남기고
   *    · 관리자 능력 설명줄과 시너지 설명은 감춥니다
   *  숫자를 다시 보고 싶으면 아래 display:none 줄을 지우면 됩니다.
   */
  @media (max-width:640px){
    :root{ --stageh:150px; }
    #app{padding:10px 10px 28px;}
    header{gap:8px;padding-bottom:6px;margin-bottom:8px;}
    header .brand{font-size:14px;letter-spacing:.14em;}
    header .chap{display:none;}                 /* 장 제목은 접습니다 */

    #log{height:180px;padding:11px 13px;font-size:14px;}
    #log p{margin:0 0 6px;}
    #log .divider{margin:8px 0;}

    #party{grid-template-columns:repeat(3,1fr);gap:5px;}
    .pcard{padding:6px 7px;font-size:12px;}
    .pcard .nm{font-size:12.5px;}
    .pcard .id{display:none;}                   /* 장착한 인격 이름 */
    .pcard .ostat{display:none;}                /* 공·방 수치 */
    .pcard .st{font-size:11px;}
    .pcard .cmd{font-size:11px;}

    #synergy{gap:4px;margin-top:6px;}
    .syn .eff, .adv, .gift{display:none;}       /* 시너지 효과·교육위원·기프트 딱지 */
    .syn{font-size:10.5px;padding:2px 7px;}

    #manage{margin-top:6px;}
    .mgwrap{padding:5px 9px;font-size:11px;gap:7px;}
    .mgwrap .mgsub{display:none;}               /* 회복 안내 */
    .mgskills{display:none;}                    /* 능력 설명줄 넷 */
    .mgwrap .mgpips i{width:13px;height:9px;}

    #enk{margin-top:6px;}
    .enkwrap{font-size:11px;padding:5px 9px;}

    #actions{margin-top:8px;gap:5px;}
    button{font-size:12.5px;padding:6px 10px;}

    .card img{max-width:120px;max-height:160px;}
    .sheet{padding:14px 13px;}
    .grid{grid-template-columns:1fr;}
    /* 배정 광고 띠도 화면에 맞춰 낮춥니다 */
    .pkline{height:92px;font-size:16px;letter-spacing:.06em;padding:0 10px;}
    .pkline.small{height:46px;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="brand">라슈 컴퍼니</span>
    <span class="chap" id="chaplabel"></span>
    <span class="right" id="wallet"></span>
  </header>

  <div id="stage"></div>
  <div id="log"></div>
  <div id="party"></div>
  <div id="synergy"></div>
  <div id="manage"></div>
  <div id="enk"></div>
  <div id="actions"></div>
</div>

<div id="modal"><div class="sheet" id="sheet"></div></div>

<script src="data/access.js"></script>
<script src="data/vault.js"></script>

<script src="data/pickup.js"></script>

<script src="data/story.js"></script>

    '<p class="sys">그래도 안 되면 같은 폴더의 <b>라슈컴퍼니_단일파일.html</b> 을 여세요. ' +
    '(모든 것이 한 파일에 들어 있어 반드시 실행됩니다)</p>';
}
</script>
</body>
</html>
